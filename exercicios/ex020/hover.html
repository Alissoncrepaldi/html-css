<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;

}   

div >p {
    display:none;
}

Div:hover >p {
    display: block;
    color: white;
    background-color: red;
    width: 300px;
}

div:hover {
    color: red;
}

h1{
    text-align: center;
}
    </style>
</head>
<body>

    </div>
    <HR></HR>
    <br>
        <div>
        MASSAS

        <P>PENNE - R$20,00</P>
        <P>LASANHA - R$20,00</P>

            <HR></HR>

</html>
