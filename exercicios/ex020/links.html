<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: black ;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: gray;
        }

        a:hover {
            color: blueviolet;
            text-decoration: underline;
        }

        a:active {
            color: aquamarine;
        }

        a::after {
            content:' link ';
        }

        .especial {
            background-color: rgb(255, 71, 71);
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
       <li><a href="https://github.com/gustavoguanabara/html-css/tree/master" class="especial"> 
        Repositório Github</a></li>
    
    </ul>
</body>
</html>
