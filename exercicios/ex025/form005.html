<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get">
    <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="ismas" value="M"><label for="ismas">Masculino</label> <br>
        <input type="radio" name="sexo" id="isfem" value="F"> <label for="isfem">Feminino</label>
    </fieldset>


    <fieldset>
        <legend>Esportes Favoritos</legend>
        <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>  <br>
        <input type="checkbox" name="skate" id="iskate">  <label for="iskate">Skate</label> <br>
        <input type="checkbox" name="luta" id="iluta"> <label for="iluta">Luta</label> <br>
        <input type="checkbox" name="corrida" id="icorrida"> <label for="icorrida">Corrida</label> <br>
    </fieldset>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
